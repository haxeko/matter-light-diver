y="8">100 nF</tspan></text><text x="187.2" y="-216.0" dominant-baseline="central" fill="#1f4e9c" font-size="9" font-family="sans" text-anchor="end"><tspan x="187.2" dy="9">VDD  (← D3/C3, khối 2)</tspan></text><text x="219.6" y="-159.20000000000002" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="middle"><tspan x="219.6" dy="8">R5  150 kΩ 1 %</tspan></text><text x="172.79999999999998" y="-147.6" dominant-baseline="central" fill="#1f4e9c" font-size="9" font-family="sans" text-anchor="end"><tspan x="172.79999999999998" dy="9">AUX  (← cuộn phụ)</tspan></text><text x="262.79999999999995" y="-121.80000000000001" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="end"><tspan x="262.79999999999995" dy="8">R6</tspan><tspan x="262.79999999999995" dy="8">20 kΩ 1 %</tspan></text><text x="10.8" y="-262.20000000000005" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="10.8" dy="8">VS lấy mẫu V+ qua cuộn phụ: OVP ≈ 50 V, phát hiện</tspan><tspan x="10.8" dy="8">valley (QR), giới hạn CC sơ cấp Imax ≈ 1.1 A</tspan></text><text x="269.99999999999994" y="-58.80000000000001" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="end"><tspan x="269.99999999999994" dy="8">C6</tspan><tspan x="269.99999999999994" dy="8">1 nF</tspan></text><text x="105.3" y="-73.10000000000002" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="105.3" dy="11">2</tspan></text><text x="113.39999999999998" y="-73.4" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="start"><tspan x="113.39999999999998" dy="14">K</tspan></text><text x="105.3" y="-116.30000000000003" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="105.3" dy="11">1</tspan></text><text x="113.39999999999998" y="-116.60000000000002" dominant-
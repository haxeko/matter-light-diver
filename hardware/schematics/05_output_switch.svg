eline="central" fill="black" font-size="14" font-family="sans" text-anchor="end"><tspan x="174.6" dy="14">Y</tspan></text><text x="146.70000000000002" y="-96.5" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="146.70000000000002" dy="11">5</tspan></text><text x="144.0" y="-91.4" dominant-baseline="hanging" fill="black" font-size="14" font-family="sans" text-anchor="middle"><tspan x="144.0" dy="14">VCC</tspan></text><text x="146.70000000000002" y="-22.7" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="146.70000000000002" dy="11">1</tspan></text><text x="144.0" y="-44.599999999999994" dominant-baseline="ideographic" fill="black" font-size="14" font-family="sans" text-anchor="middle"><tspan x="144.0" dy="14">OE</tspan></text><text x="147.6" y="-8.4" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="middle"><tspan x="147.6" dy="8">U6  74AHCT1G125</tspan><tspan x="147.6" dy="8">(Vih 2 V → chấp nhận 3.3 V)</tspan></text><text x="36.0" y="-59.4" dominant-baseline="central" fill="#1f4e9c" font-size="9" font-family="sans" text-anchor="end"><tspan x="36.0" dy="9">PWM_WW  (GPIO1, 3.3 V, PWM 4 kHz)</tspan></text><text x="144.0" y="-142.2" dominant-baseline="ideographic" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="144.0" dy="9">+5 V</tspan></text><text x="237.6" y="-78.2" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="middle"><tspan x="237.6" dy="8">R26  47 Ω</tspan></text><text x="262.8" y="-30.0" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="end"><tspan x="262.8" dy="8">R27</tspan><tspan x="262.8" dy="8">100 kΩ</tspan></text><text x="337.32000000000005" y="-107.39999999999999" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="337.32000000000005" dy="8">Q3  IRLML0060 / AO3160</tspan><tspan x="337.32000000000005" dy="8">60 V, Rds ≤ 0.25 Ω @ 4.5 V, SOT-23</tspan></text><text x="486.72" y="-349.2" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="end"><tspan x="486.72" dy="9">V+</tspan></text><text x="486.72" y="-327.59999999999997" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="end"><tspan x="486.72" dy="9">CW–</tspan></text><text x="486.72" y="-306.0" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="end"><tspan x="486.72" dy="9">WW–</tspan></text><text x="535.32" y="-259.0" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="535.32" dy="8">J2  đầu ra 3 dây</tspan><tspan x="535.32" dy="8">(cầu đấu 3.5 mm / JST-XH)</tspan><tspan x="535.32" dy="8">V+ chung (anode), CW–, WW–</tspan></text><text x="409.32000000000005" y="-345.59999999999997" dominant-baseline="central" fill="#1f4e9c" font-size="9" font-family="sans" text-anchor="end"><tspan x="409.32000000000005" dy="9">V+</tspan></text><text x="380.52" y="-10.799999999999999" dominant-baseline="central" fill="#1f4e9c" font-size="9" font-family="sans" text-anchor="start"><tspan x="380.52" dy="9">SENSE+  (→ R9/U3A, khối 4)</tspan></text><text x="333.72" y="29.400000000000006" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="333.72" dy="8">R7  0R15 / 1 W</tspan><tspan x="333.72" dy="8">(2× 0R30 1206 song song, Kelvin)</tspan></text><text x="331.92" y="76.32" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="start"><tspan x="331.92" dy="9">GND_S</tspan></text><text x="3.6" y="87.00000000000001" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="3.6" dy="8">Dòng LED = dòng CC của flyback, chia thời gian giữa CW và WW bằng PWM bù nhau (CW duty = 1 – WW duty, chồng lấn ~2 µs).</tspan><tspan x="3.6" dy="8">Khi cả hai khoá ngắt (đèn tắt) dòng = 0 → vòng CV giữ V+ = 45 V. Cả hai FET chỉ thấy Vds ≤ 45 V. Dòng cấp cho buck/MCU không qua R7.</tspan></text><circle cx="39.6" cy="-270" r="2.16" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="270" cy="-270" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="39.6" cy="-54" r="2.16" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="270" cy="-54" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="499.32" cy="-340.2" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="499.32" cy="-318.6" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="499.32" cy="-297" r="3.6" style="stroke:black;fill:white;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="412.92" cy="-340.2" r="2.16" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="319.32" cy="1.8" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="376.92" cy="1.8" r="2.16" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /></svg>
="-147.20000000000002" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="end"><tspan x="261.0" dy="14">SW</tspan></text><text x="218.70000000000002" y="-44.3" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="218.70000000000002" dy="11">1</tspan></text><text x="216.0" y="-55.4" dominant-baseline="ideographic" fill="black" font-size="14" font-family="sans" text-anchor="middle"><tspan x="216.0" dy="14">GND</tspan></text><text x="219.6" y="-242.39999999999998" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="middle"><tspan x="219.6" dy="8">U7  LMR16006YDDCR (SOT-23-6, 700 kHz)</tspan><tspan x="219.6" dy="8">thay thế: MP9486A, XL7005A (đổi chia áp FB)</tspan></text><text x="10.79999999999999" y="-142.0" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="end"><tspan x="10.79999999999999" dy="8">C16  4.7 µF</tspan><tspan x="10.79999999999999" dy="8">100 V X7R</tspan><tspan x="10.79999999999999" dy="8">+ 100 nF</tspan></text><text x="-50.40000000000003" y="-163.8" dominant-baseline="central" fill="#1f4e9c" font-size="9" font-family="sans" text-anchor="end"><tspan x="-50.40000000000003" dy="9">V+  (20–45 V)</tspan></text><text x="118.79999999999998" y="-185.20000000000002" dominant-baseline="central" fill="black" font-size="7" font-family="sans" text-anchor="middle"><tspan x="118.79999999999998" dy="7">R28 100 kΩ (EN ← VIN)</tspan></text><text x="104.39999999999999" y="-33.6" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="end"><tspan x="104.39999999999999" dy="8">R30</tspan><tspan x="104.39999999999999" dy="8">10 kΩ 1 %</tspan></text><text x="334.8" y="-116.39999999999999" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="334.8" dy="8">C17 100 nF</tspan><tspan x="334.8" dy="8">(bootstrap)</tspan></text><text x="327.6" y="-109.2" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="327.6" dy="8">D6  SS16 / SS110</tspan><tspan x="327.6" dy="8">(Schottky 60–100 V)</tspan></text><text x="370.79999999999995" y="-159.20000000000002" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="middle"><tspan x="370.79999999999995" dy="8">L2  22 µH / 1 A (CD54 / 5×5)</tspan></text><text x="428.40000000000003" y="-102.0" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="428.40000000000003" dy="8">C18  22 µF ×2</tspan><tspan x="428.40000000000003" dy="8">10 V X7R</tspan></text><text x="475.20000000000005" y="-145.8" dominant-baseline="ideographic" fill="#1f4e9c" font-size="9" font-family="sans" text-anchor="middle"><tspan x="475.20000000000005" dy="9">+5 V  (opto, U3, U5/U6, LDO)</tspan></text><text x="104.39999999999999" y="-133.0" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="end"><tspan x="104.39999999999999" dy="8">R29 56 kΩ 1 %</tspan><tspan x="104.39999999999999" dy="8">Vout = 0.765 ×</tspan><tspan x="104.39999999999999" dy="8">(1 + 56/10) = 5.05 V</tspan></text><text x="228.6" y="2.5199999999999996" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="start"><tspan x="228.6" dy="9">GND_S</tspan></text><text x="544.5" y="101.5" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="544.5" dy="11">1</tspan></text><text x="552.6" y="101.2" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="start"><tspan x="552.6" dy="14">VIN</tspan></text><text x="544.5" y="58.30000000000001" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="544.5" dy="11">3</tspan></text><text x="552.6" y="58.0" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="start"><tspan x="552.6" dy="14">EN</tspan></text><text x="643.5" y="79.9" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="643.5" dy="11">5</tspan></text><text x="635.4" y="79.60000000000001" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="end"><tspan x="635.4" dy="14">VOUT</tspan></text><text x="596.6999999999999" y="128.5" dominant-baseline="hanging" fill="black" font-size="11" font-family="sans" text-anchor="start"><tspan x="596.6999999999999" dy="11">2</tspan></text><text x="594.0" y="117.4" dominant-baseline="ideographic" fill="black" font-size="14" font-family="sans" text-anchor="middle"><tspan x="594.0" dy="14">GND</tspan></text><text x="597.6" y="28.0" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="middle"><tspan x="597.6" dy="8">U8  ME6211C33 / RT9013-33 (SOT-23-5, 500 mA)</tspan></text><text x="478.79999999999995" y="139.6" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="end"><tspan x="478.79999999999995" dy="8">C19 1 µF</tspan></text><text x="424.79999999999995" y="109.80000000000001" dominant-baseline="central" fill="#1f4e9c" font-size="9" font-family="sans" text-anchor="end"><tspan x="424.79999999999995" dy="9">+5 V</tspan></text><text x="716.4000000000001" y="114.0" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="716.4000000000001" dy="8">C20 10 µF + 100 nF</tspan><tspan x="716.4000000000001" dy="8">(sát chân 3V3 module)</tspan></text><text x="770.4000000000001" y="81.0" dominant-baseline="central" fill="#1f4e9c" font-size="9" font-family="sans" text-anchor="start"><tspan x="770.4000000000001" dy="9">+3V3  (ESP32-C6, ≤ 350 mA đỉnh)</tspan></text><text x="606.6" y="175.32" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="start"><tspan x="606.6" dy="9">GND_S</tspan></text><text x="3.6" y="157.2" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="3.6" dy="8">Tổn hao: buck ≈ 0.2 W (η 85 %), LDO ≈ 0.26 W @150 mA. Tổng dòng kéo từ V+: 25–55 mA. Đặt D6, C16, U7 thành vòng nhỏ; L2 cách anten ≥ 10 mm.</tspan><tspan x="3.6" dy="8">Có thể bỏ LDO và dùng buck 3.3 V trực tiếp nếu chấp nhận lái cổng FET bằng 3.3 V (Rds cao hơn ~40 %).</tspan></text><circle cx="18" cy="-158.4" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="-46.8" cy="-158.4" r="2.16" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="122.4" cy="-158.4" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="111.6" cy="-57.6" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="320.4" cy="-133.2" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="414" cy="-133.2" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="471.6" cy="-133.2" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="471.6" cy="-133.2" r="2.16" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="486" cy="115.2" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="428.4" cy="115.2" r="2.16" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="702" cy="93.6" r="2.7" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /><circle cx="766.8" cy="93.6" r="2.16" style="stroke:black;fill:black;stroke-width:1.3;stroke-dasharray:-;" /></svg>
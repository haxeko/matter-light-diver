<text x="40.0" y="416.0" text-anchor="start" font-size="9" font-weight="normal" font-family="Arial, Helvetica, sans-serif" fill="#333">Ghi chú: linh kiện SMD nhỏ (R, C 0603, SOT-23) của phía thứ cấp có thể đặt mặt dưới để rút ngắn chiều dài. Vùng dưới module ESP32-C6 và vùng anten (x ≥ 87 mm) không đổ đồng cả hai lớp.</text>
<text x="40.0" y="432.0" text-anchor="start" font-size="9" font-weight="normal" font-family="Arial, Helvetica, sans-serif" fill="#333">Đường dòng lớn: AC→BR1→C1→T1→Q1→R2→C1 (vòng nhỏ, cùng lớp). Thứ cấp: T1→D2→C4→R7 (vòng nhỏ). Buck: U7→L2→C15 và D6 sát U7. Tụ CY1 nối cực âm C1 ↔ GND_S ngay cạnh T1.</text>
<text x="40.0" y="448.0" text-anchor="start" font-size="9" font-weight="normal" font-family="Arial, Helvetica, sans-serif" fill="#333">Vỏ nhựa PC (không kim loại) để anten hoạt động; dây AC/LED cố định bằng kẹp; khoảng cách linh kiện cao (C1, T1, L1) tới nắp ≥ 2 mm. Chiều cao tổng ≤ 21 mm.</text>

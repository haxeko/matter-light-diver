<text x="40.0" y="24.0" text-anchor="start" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif" fill="#333">Floorplan PCB driver CCT 3 dây – 30 × 90 mm, FR4 1.6 mm, 2 lớp, đồng 2 oz (bản 40 W). Tỉ lệ 10 px = 1 mm.</text>
<text x="40.0" y="42.0" text-anchor="start" font-size="10" font-weight="normal" font-family="Arial, Helvetica, sans-serif" fill="#333">Màu: đỏ = sơ cấp (điện áp lưới), xanh lá = thứ cấp SELV, vàng = giao diện người dùng, xám gạch = keep-out đồng (creepage / anten).</text>
